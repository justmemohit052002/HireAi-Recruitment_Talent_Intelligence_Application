server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: hireai-backend

  datasource:
    url: "jdbc:postgresql://127.0.0.1:${DB_PORT:5433}/${DB_NAME:hireai_db}"
    username: "${DB_USER:hireai_user}"
    password: "${DB_PASSWORD:ChangeThis_Postgres_2026!}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: ${REDIS_PORT:6379}
      password: "${REDIS_PASSWORD:ChangeThis_Redis_2026!}"
      timeout: 3000ms

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

hireai:
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      access-token-expiration-ms: 1800000 # 30 minutes
      refresh-token-expiration-ms: 604800000 # 7 days
    pin:
      expiration-minutes: 10
      max-attempts: 5

logging:
  level:
    root: INFO
    com.hireai: DEBUG
